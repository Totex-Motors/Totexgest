name: Reparar histórico de migrations (uso único)

# Acerta SÓ a tabela supabase_migrations.schema_migrations do projeto de produção
# (mztfyavuclqzivywkaeu) — NÃO roda nenhum SQL de migration.
#
# Contexto (2026-10-11): o banco foi construído por SQL Editor + MCP, que registram
# versões "timestamp" (ex.: 20260702002457) que não existem como arquivo no repo
# (117 órfãs), e os arquivos do repo foram aplicados à mão sem serem marcados
# (89 faltando). Resultado: o passo "Apply migrations (db push)" do
# deploy-supabase.yml falha desde 02/10 com "Remote migration versions not found".
#
# O que este workflow faz (modo "reparar"):
#   1. marca as 117 órfãs como "reverted"  → apaga só a LINHA do histórico
#   2. marca as 89 versões do repo como "applied" → insere só a LINHA do histórico
#   3. mostra `supabase migration list` e `supabase db push --dry-run` (deve ficar vazio)
# Modo "simular" (padrão): só mostra o estado atual, não muda nada.
#
# Depois do reparo, apagar este arquivo (uso único).

on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'simular = só mostra; reparar = acerta o histórico (produção!)'
        type: choice
        default: simular
        options: [simular, reparar]

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_ID: mztfyavuclqzivywkaeu
      # Versões que existem no banco mas não têm arquivo no repo (saída do próprio db push em 11/10/2026)
      ORFAS: >-
        20260702002457 20260703103601 20260711142735 20260711144221 20260712143957 20260712160235 20260712194511
        20260815160728 20260815160835 20260815160900 20260815180849 20260815185351 20260815213426 20260820165102
        20260820165711 20260820165746 20260820165900 20260821021909 20260821030807 20260821115145 20260821115905
        20260822141029 20260822142531 20260823101952 20260823102001 20260823112240 20260823131412 20260823140920
        20260823142238 20260823144026 20260823145711 20260823150437 20260823150604 20260823160631 20260823160657
        20260823173911 20260823215554 20260824003120 20260824003152 20260824003743 20260824005817 20260824005840
        20260904005351 20260904005442 20260904005514 20260904005541 20260904005721 20260910131945 20260910133256
        20260910143442 20260910154303 20260910162404 20260910194931 20260910200058 20260910200919 20260910221733
        20260911010501 20260911012515 20260911022628 20260911031843 20260911133214 20260911133404 20260911144124
        20260911144304 20260911154037 20260911154146 20260912114033 20260912144304 20260912144435 20260912150742
        20260912155505 20260912160129 20260912160300 20260914110025 20260915033658 20260915233859 20260916013700
        20260916014112 20260916020328 20260916021623 20260916022240 20260916022257 20260916025450 20260916025625
        20260916030307 20260916093913 20260916161231 20260916162712 20260916163531 20260917005106 20260917030634
        20260918023648 20260918023657 20260918203045 20260918213122 20260919130904 20260919131718 20260919133855
        20260919153130 20260919155014 20260920151706 20260921011652 20260921014003 20260921015101 20260921021159
        20260921144436 20260922003838 20260922004758 20260922011501 20260924003716 20260925000307 20260925014052
        20260925022308 20260925022433 20260925022659 20261007235357 20261008005953
      # Arquivos do repo já aplicados à mão em produção mas sem linha no histórico (conferido por SQL em 11/10/2026)
      FALTANDO: >-
        20260620000 20260620001 20260620002 20260620003 20260620004 20260623 20260623000 20260623001 20260626
        20260702 20260703 20260703001 20260704000001 20260704000002 20260706 20260712000001 20260712120000
        20260712130000 20260815100001 20260815100002 20260815100003 20260821030000 20260821050000 20260821120000
        20260821130000 20260822150000 20260823100000 20260823110000 20260823120000 20260823130000 20260823140000
        20260823160000 20260823170000 20260823180000 20260910100000 20260910120000 20260910140000 20260910160000
        20260910180000 20260910190000 20260910200000 20260910210000 20260911100000 20260911120000 20260911130000
        20260911140000 20260911160000 20260911200000 20260912100000 20260912120000 20260913100000 20260914100000
        20260914160000 20260915100000 20260915140000 20260916100000 20260916140000 20260917100000 20260918100000
        20260919100000 20260920100000 20260921100000 20260921140000 20260922100000 20260922140000 20260922160000
        20260922180000 20260922220000 20260922230000 20260923100000 20260923120000 20260923130000 20260923140000
        20260923232053 20260925120000 20260925140000 20260925145000 20260925150000 20260925160000 20260928120000
        20261002120000 20261003120000 20261007120000 20261008120000 20261008130000 20261008140000 20261009120000
        20261011130000 20261011150000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link
        run: supabase link --project-ref "$PROJECT_ID"

      - name: Estado ANTES
        run: |
          echo "órfãs: $(echo $ORFAS | wc -w) | faltando: $(echo $FALTANDO | wc -w) | arquivos locais: $(ls supabase/migrations/*.sql | wc -l)"
          supabase migration list

      - name: Reparar histórico (só a tabela, sem rodar SQL)
        if: ${{ inputs.modo == 'reparar' }}
        run: |
          set -e
          echo "== marcando órfãs como reverted"
          supabase migration repair --status reverted $ORFAS
          echo "== marcando versões do repo como applied"
          supabase migration repair --status applied $FALTANDO

      - name: Estado DEPOIS + conferência (db push --dry-run deve não ter nada pra aplicar)
        if: ${{ inputs.modo == 'reparar' }}
        run: |
          supabase migration list
          supabase db push --dry-run
